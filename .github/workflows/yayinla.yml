name: Kurulum dosyasini yayinla
on:
  push:
    branches: [kurulum-yukleme]
permissions:
  contents: write
jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Birlestir ve dogrula
        run: |
          cat parca/kurulum.* > Kollege-Kurulum-0.4.2.exe
          sha256sum -c toplam.sha256
      - name: Surume ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.4.2 Kollege-Kurulum-0.4.2.exe --clobber --repo "$GITHUB_REPOSITORY"
