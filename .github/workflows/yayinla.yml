name: Kurulum dosyasini yayinla
on:
  push:
    branches: [kurulum-yukleme]
permissions:
  contents: write
jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Birlestir ve dogrula
        run: |
          cat parca/kurulum.* > Kollege-Kurulum-0.4.3.exe
          sha256sum -c toplam.sha256
      - name: Surum olustur
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.4.3 Kollege-Kurulum-0.4.3.exe --repo "$GITHUB_REPOSITORY" --target main --title "Kollege 0.4.3" --notes "Almanca arayuzde Turkce kalan yazilar duzeltildi (gun adlari, muhasebe defteri, ciktilar, ilk kurulum formu). Dar pencere gorunumu ve harita hatasi duzeltildi. Windows ve macOS."
