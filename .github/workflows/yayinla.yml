name: Kurulum dosyasini yayinla
on:
  push:
    branches: [kurulum-yukleme]
permissions:
  contents: write
jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Birlestir ve dogrula
        run: |
          cat parca/kurulum.* > Kollege-Kurulum-0.4.5.exe
          sha256sum -c toplam.sha256
      - name: Surum olustur
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.4.5 Kollege-Kurulum-0.4.5.exe --repo "$GITHUB_REPOSITORY" --target main --title "Kollege 0.4.5" --notes "Kolay kullanim. Sayfa aciklamalari soru isareti dugmesine tasindi ve Iletisim sayfasi eklendi. Yenilikler - sade menu, baslangic adimlari, sade gider ve fatura formlari, satirdan ucret odeme, faturada musteri ekleme, indirilen PDF dosyasinin kendiliginden acilmasi. Windows ve macOS."
